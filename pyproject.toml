[project]
name = "smdb"
version = "0.1.0"
description = "Late-interaction (ColBERT) retrieval with an IVF+PQ index stored in Cassandra partitions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "cassandra-driver>=3.29",
    # the driver's default reactor needs asyncore, which Python 3.12 removed
    "pyasyncore>=1.0.4; python_version >= '3.12'",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
encoder = ["torch>=2.2", "transformers>=4.40", "safetensors>=0.4", "huggingface_hub>=0.23"]
bench = ["ir-datasets>=0.5.6", "tqdm>=4.66", "faiss-cpu>=1.9"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smdb*"]

[tool.setuptools.package-data]
smdb = ["store/schema.cql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
